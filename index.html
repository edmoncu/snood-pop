<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snood Pop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Snood Pop game">
      <section class="topbar" aria-label="Game stats">
        <div>
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Shots</span>
          <strong id="shots">0</strong>
        </div>
        <div>
          <span class="label">Level</span>
          <strong id="level">1</strong>
        </div>
        <button id="restart" type="button" aria-label="Restart game" title="Restart">
          <span aria-hidden="true">↻</span>
        </button>
      </section>

      <section class="game-shell">
        <canvas id="game" width="900" height="1080" aria-label="Playable Snood Pop canvas"></canvas>
        <div id="overlay" class="overlay hidden" role="status" aria-live="polite">
          <strong id="overlayTitle"></strong>
          <span id="overlayText"></span>
          <button id="overlayButton" type="button">Play again</button>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
